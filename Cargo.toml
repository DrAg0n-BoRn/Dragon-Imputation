[package]
name = "dragon-imputation"
version = "0.2.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "dragon_imputation"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py38"] }
polars = { version = "0.55.2"}
pyo3-polars = { version = "0.28.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
smartcore = { version = "0.3.2" }
rayon = "1.12.0"
